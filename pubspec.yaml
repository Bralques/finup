name: finup
description: "Finup — seu controle financeiro pessoal"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.4

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Charts
  fl_chart: ^0.70.2

  # Local DB (offline)
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5
  path: ^1.9.1

  # Internationalization / formatting
  intl: ^0.19.0

  # Fonts & icons
  google_fonts: ^6.2.1
  flutter_svg: ^2.3.0

  # Utilities
  uuid: ^4.5.1
  equatable: ^2.0.7
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  collection: ^1.18.0
  shared_preferences: ^2.3.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  freezed: ^3.0.6
  json_serializable: ^6.9.3
  drift_dev: ^2.23.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
